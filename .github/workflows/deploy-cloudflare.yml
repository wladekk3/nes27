name: Deploy NE S27 to Cloudflare
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ne-s27-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_D1_PREVIEW_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_PREVIEW_DATABASE_ID }}
      ADMIN_DISCORD_IDS: ${{ secrets.ADMIN_DISCORD_IDS }}
      MANAGER_DISCORD_IDS: ${{ secrets.MANAGER_DISCORD_IDS }}
      BOT_WEBHOOK_SECRET: ${{ secrets.BOT_WEBHOOK_SECRET }}
      SITE_BASE_URL: ${{ github.ref == 'refs/heads/main' && secrets.SITE_BASE_URL || secrets.PREVIEW_SITE_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/cloudflare-config.mjs
      - run: npx wrangler d1 migrations apply DB --remote --config wrangler.deploy.json
      - run: printf '%s' "$BOT_WEBHOOK_SECRET" | npx wrangler secret put BOT_WEBHOOK_SECRET --config wrangler.deploy.json
      - run: npx wrangler deploy --config wrangler.deploy.json
