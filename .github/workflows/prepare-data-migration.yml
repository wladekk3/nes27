name: Prepare secure NE S27 data migration

on:
  push:
    branches: [main]
    paths:
      - scripts/migration-key.mjs
      - .github/workflows/prepare-data-migration.yml

jobs:
  public-key:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MIGRATION_KEY_SOURCE: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Derive one-time migration public key
        run: node scripts/migration-key.mjs public
